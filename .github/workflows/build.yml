name: Build Kevy does Devy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DKDD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Engine render test
        run: build\Release\kdd_render_test.exe

      - name: Validate with pluginval
        id: pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $proc = Start-Process -FilePath .\pluginval\pluginval.exe -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput pluginval-report.txt -RedirectStandardError pluginval-errors.txt `
            -ArgumentList '--strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 600000 --validate "build\KevyDoesDevy_artefacts\Release\VST3\Kevy does Devy.vst3"'
          $code = $proc.ExitCode
          Get-Content pluginval-report.txt -Tail 15
          Get-Content pluginval-report.txt | Select-String -Pattern "FAILED|!!!|ERROR|Error|crash|Exception" | Select-Object -Last 40 | ForEach-Object { Write-Output "::warning::$($_.Line)" }
          exit $code

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\KevyDoesDevy_artefacts\Release\VST3\Kevy does Devy.vst3" dist\
          Copy-Item "build\KevyDoesDevy_artefacts\Release\Standalone\Kevy does Devy.exe" "dist\Kevy does Devy standalone.exe"
          Copy-Item docs\SETUP-GUIDE.md "dist\SETUP GUIDE.txt"
          if (Test-Path pluginval-report.txt) { Copy-Item pluginval-report.txt dist\ }

      # Artifact storage counts against the account quota, so the finished
      # plugin is published to a 'builds' branch instead (as Prism Patch does).
      - name: Publish to the builds branch
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath KevyDoesDevy-Windows.zip -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -r -q --cached .
          git add -f KevyDoesDevy-Windows.zip
          git commit -q -m "Windows build $env:GITHUB_SHA"
          git push -f origin builds
